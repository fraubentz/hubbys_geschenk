name: Print today's edition
on:
  schedule:
    - cron: "30 5 * * *"   # every day at 05:30 UTC
  workflow_dispatch:        # adds a manual "Run workflow" button
permissions:
  contents: write
jobs:
  print:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build.py
      - name: Save the new edition
        run: |
          git config user.name "gazette-bot"
          git config user.email "gazette-bot@users.noreply.github.com"
          git add index.html archive
          git diff --cached --quiet || git commit -m "Edition of $(date -u +%F)"
          git push
